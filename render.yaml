services:
  - type: web
    name: openrouter-digital-double
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: GIGACHAT_CREDENTIALS
        sync: false
      - key: GIGACHAT_SCOPE
        value: GIGACHAT_API_PERS
      - key: GIGACHAT_MODEL
        value: GigaChat-2
      - key: GIGACHAT_BASE_URL
        value: https://api.giga.chat
      - key: GIGACHAT_OAUTH_URL
        value: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
      - key: GIGACHAT_VERIFY_SSL
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TEMPERATURE
        value: "0.6"
      - key: MAX_TOKENS
        value: "700"
